databases:
  - name: checkin-db
    databaseName: checkin
    plan: free
    ipAllowList: []

services:
  - type: web
    name: checkin-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        defaultValue: sqlite:////var/tmp/checkin.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        defaultValue: "https://checkin.vercel.app"
